<app-navigation></app-navigation>

<main class="min-h-screen bg-[#FAF3EE]">
  
  <section class="hero-section">
    <div class="relative z-10 max-w-4xl mx-auto px-6 text-center">
      <p class="text-[#BDCDE6] uppercase tracking-[0.4em] text-xs font-bold mb-4 animate-fade-in-up">The Collection</p>
      <h1>Our Masterpieces</h1>
      <p>Where artistry meets elegance. A visual journey through our finest transformations.</p>
    </div>
  </section>

  <div class="max-w-[1400px] mx-auto px-6 -mt-20 relative z-20 pb-20">
    
    <div class="flex flex-wrap justify-center gap-4 mb-16">
      <button *ngFor="let cat of categories" 
              (click)="setFilter(cat)"
              class="category-btn"
              [class.active]="activeFilter === cat">
        {{ cat }}
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let item of filteredImages" 
           class="group relative h-[400px] overflow-hidden rounded-sm cursor-pointer shadow-sm hover:shadow-2xl transition-all duration-500">
        
        <img [src]="item.url" 
             [alt]="item.title" 
             class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110">
        
        <div class="absolute inset-0 bg-[#2C2B30]/80 opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col items-center justify-center p-6 text-center">
          <span class="text-[#BDCDE6] text-[10px] uppercase tracking-[0.3em] mb-4 transform translate-y-4 group-hover:translate-y-0 transition-transform duration-500 delay-100">
            {{ item.category }}
          </span>
          <h3 class="text-3xl font-playfair text-[#FAF3EE] italic transform translate-y-4 group-hover:translate-y-0 transition-transform duration-500 delay-200">
            {{ item.title }}
          </h3>
          <div class="w-12 h-[1px] bg-[#BDCDE6] mt-6 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-700 delay-300"></div>
        </div>

      </div>
    </div>

    <div *ngIf="filteredImages.length === 0" class="text-center py-20">
      <p class="text-[#B2BABC] font-playfair text-2xl italic">No images found in this category.</p>
    </div>

  </div>
</main>

<app-footer></app-footer>
