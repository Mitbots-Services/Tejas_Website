<app-navigation></app-navigation>

<main class="min-h-screen bg-[#FAF3EE]">
  
  <section class="hero-section">
    <div class="relative z-10 max-w-4xl mx-auto px-6 text-center">
      <p class="text-[#BDCDE6] uppercase tracking-[0.4em] text-xs font-bold mb-4 animate-fade-in-up">The Artisans</p>
      <h1>Meet Our Team</h1>
      <p>A collective of master stylists and therapists dedicated to your perfection.</p>
    </div>
  </section>

  <div class="max-w-[1400px] mx-auto px-6 -mt-20 relative z-20 pb-20">
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
      
      <div *ngFor="let member of team" class="team-card group bg-white rounded-xl overflow-hidden shadow-lg border border-[#B2BABC]/20">
        
        <div class="relative h-[450px] overflow-hidden">
          <img [src]="member.image" [alt]="member.name" 
               class="w-full h-full object-cover transition-all duration-700 group-hover:scale-105 group-hover:grayscale">
          
          <div class="absolute inset-0 bg-[#2C2B30]/90 backdrop-blur-sm opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-center p-8 text-center">
            <p class="text-[#BDCDE6] text-sm italic font-playfair leading-relaxed mb-6">"{{ member.bio }}"</p>
            <div class="space-y-2">
              <span *ngFor="let skill of member.specialties" class="block text-[10px] uppercase tracking-[0.2em] text-[#FAF3EE]">
                {{ skill }}
              </span>
            </div>
          </div>
        </div>

        <div class="p-6 text-center bg-white relative z-10 transition-colors duration-300 group-hover:bg-[#2C2B30]">
          <h3 class="text-2xl font-playfair text-[#2C2B30] mb-1 group-hover:text-[#BDCDE6] transition-colors">
            {{ member.name }}
          </h3>
          <p class="text-[#B2BABC] text-xs uppercase tracking-[0.2em] group-hover:text-[#FAF3EE] transition-colors">
            {{ member.role }}
          </p>
        </div>

      </div>

    </div>

    <div class="mt-24 text-center">
      <h2 class="text-3xl font-playfair text-[#2C2B30] mb-6">Experience Their Artistry</h2>
      <a href="/booking" class="inline-block px-10 py-4 border border-[#2C2B30] text-[#2C2B30] uppercase tracking-[0.2em] text-xs font-bold hover:bg-[#2C2B30] hover:text-[#FAF3EE] transition-all duration-300">
        Book an Appointment
      </a>
    </div>

  </div>
</main>

<app-footer></app-footer>
