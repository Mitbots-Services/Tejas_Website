<app-navigation></app-navigation>

<main class="min-h-screen bg-[#FAF3EE]">
  
  <section class="hero-section">
    <div class="relative z-10 max-w-4xl mx-auto px-6 text-center">
      <p class="text-[#BDCDE6] uppercase tracking-[0.4em] text-xs font-bold mb-4 animate-fade-in-up">The Edit</p>
      <h1>Journal & Insights</h1>
      <p>Curated beauty advice, trend reports, and expert tips for the modern aesthetic.</p>
    </div>
  </section>

  <div class="max-w-[1400px] mx-auto px-6 -mt-20 relative z-20 pb-20">
    
    <div class="flex flex-wrap justify-center gap-4 mb-16">
      <button *ngFor="let cat of categories" 
              (click)="setFilter(cat)"
              class="category-btn"
              [class.active]="activeFilter === cat">
        {{ cat }}
      </button>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-10">
      
      <div *ngFor="let blog of filteredBlogs" class="blog-card bg-white rounded-xl overflow-hidden shadow-lg group">
        
        <div class="relative h-64 overflow-hidden">
          <img [src]="blog.image" [alt]="blog.title" 
               class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
          <div class="absolute inset-0 bg-[#2C2B30]/20 group-hover:bg-[#2C2B30]/40 transition-colors duration-500"></div>
          
          <div class="absolute top-4 left-4 bg-[#FAF3EE]/90 backdrop-blur-sm px-4 py-1 rounded-full text-[10px] uppercase tracking-widest font-bold text-[#2C2B30]">
            {{ blog.category }}
          </div>
        </div>

        <div class="p-8">
          <div class="flex justify-between items-center mb-4">
            <span class="text-[#B2BABC] text-[10px] uppercase tracking-widest">{{ blog.date }}</span>
            <div class="h-[1px] w-12 bg-[#B2BABC]/30"></div>
          </div>

          <h3 class="text-2xl font-playfair text-[#2C2B30] mb-4 leading-tight group-hover:text-[#BDCDE6] transition-colors duration-300">
            {{ blog.title }}
          </h3>
          
          <p class="text-[#666] text-sm leading-relaxed mb-6 line-clamp-3 font-light">
            {{ blog.summary }}
          </p>

          <a [href]="blog.link" target="_blank" 
             class="inline-flex items-center text-[#2C2B30] text-xs uppercase tracking-[0.2em] font-bold border-b border-[#B2BABC] pb-1 hover:text-[#BDCDE6] hover:border-[#BDCDE6] transition-all">
            Read Article 
            <span class="ml-2 transform group-hover:translate-x-1 transition-transform">→</span>
          </a>
        </div>

      </div>

    </div>

    <div *ngIf="filteredBlogs.length === 0" class="text-center py-20">
      <p class="text-[#B2BABC] font-playfair text-2xl italic">No articles found in this category.</p>
    </div>

  </div>
</main>

<app-footer></app-footer>
