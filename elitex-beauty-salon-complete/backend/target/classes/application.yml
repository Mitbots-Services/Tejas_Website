spring:
  application:
    name: elitex-salon
  datasource:
    url: jdbc:h2:mem:elitexdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

server:
  port: 8080

error:
  include-message: always

jwt:
  secret: ${JWT_SECRET:elitex-salon-ultra-luxury-secret-key-2024-very-secure-and-long-key-for-jwt-token-generation}
  expiration: 86400000

cors:
  allowed-origins: http://localhost:4200,http://localhost:4200/
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

logging:
  level:
    root: WARN
    com.elitex.salon: INFO
    org.springframework.web: WARN
