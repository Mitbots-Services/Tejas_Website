# H2 Database Configuration (In-Memory)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:elitex_salon;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# H2 Keepalive - prevent connection from closing
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=on_param

# Logging
logging.level.root=WARN
logging.level.com.elitex.saloon=INFO
logging.level.org.springframework.web=WARN
# JWT Secret Key
jwt.secret=${JWT_SECRET:your-super-secret-key-that-is-long-and-secure}

